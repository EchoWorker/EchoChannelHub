name: pages
on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate production registry
        run: node src/hubctl.js validate --production
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: registry
      - name: Assert deployed snapshot closure
        shell: bash
        run: |
          test -f registry/v1/latest.json
          snapshot_url=$(node -p "JSON.parse(require('fs').readFileSync('registry/v1/latest.json','utf8')).snapshot.url")
          relative=${snapshot_url#*EchoChannelHub/}
          test -f "registry/$relative"
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed closure and release artifact
        run: node src/hubctl.js validate-pages https://echoworker.github.io/EchoChannelHub/v1/latest.json --production
