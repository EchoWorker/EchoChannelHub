name: preview-release
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel id
        required: true
        default: wechat
      version:
        description: Version (must match channel.json)
        required: true
        default: 0.1.4
permissions:
  contents: write
jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check requested version
        shell: pwsh
        run: |
          $actual = (Get-Content "channels/${{ inputs.channel }}/channel.json" | ConvertFrom-Json).version
          if ($actual -ne "${{ inputs.version }}") { throw "requested version does not match channel.json" }
      - run: node src/hubctl.js package ${{ inputs.channel }} --target windows-x64 --bundle-runtime
      - run: node src/hubctl.js verify artifacts/${{ inputs.channel }}-${{ inputs.version }}-windows-x64.echochannel
      - name: Create draft preview release and upload candidate
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: preview-${{ inputs.version }}
        run: |
          gh release delete "$env:TAG" --yes --cleanup-tag 2>$null
          gh release create "$env:TAG" --draft --prerelease --title "TEST ONLY preview ${{ inputs.channel }} ${{ inputs.version }}" --notes "TEST ONLY preview. Signed by the committed non-production test key. Never trust in production."
          gh release upload "$env:TAG" "artifacts/${{ inputs.channel }}-${{ inputs.version }}-windows-x64.echochannel" "artifacts/${{ inputs.channel }}-${{ inputs.version }}-windows-x64.echochannel.json"
          $release = gh api "repos/${{ github.repository }}/releases/tags/$env:TAG" | ConvertFrom-Json
          $assetName = "${{ inputs.channel }}-${{ inputs.version }}-windows-x64.echochannel"
          $asset = $release.assets | Where-Object name -eq $assetName
          if (-not $asset) { throw "uploaded release asset missing" }
          $download = Join-Path $env:RUNNER_TEMP $assetName
          Invoke-WebRequest -Uri $asset.browser_download_url -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/octet-stream" } -OutFile $download
          $metaPath = "artifacts/$assetName.json"
          $meta = Get-Content $metaPath | ConvertFrom-Json
          $meta.size = (Get-Item $download).Length
          $meta.sha256 = (Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant()
          $meta | Add-Member -NotePropertyName url -NotePropertyValue $asset.browser_download_url -Force
          $meta | ConvertTo-Json -Depth 10 | Set-Content $metaPath -Encoding utf8NoBOM
      - run: node src/hubctl.js build-registry
      - run: node src/hubctl.js validate
      - name: Publish registry and preview release atomically
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: preview-${{ inputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add registry
          git commit -m "chore: publish $env:TAG registry"
          gh release edit "$env:TAG" --draft=false --prerelease
          git push origin HEAD:main
