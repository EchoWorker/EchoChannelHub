name: preview-release
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel id
        required: true
        default: wechat
      version:
        description: Version (must match channel.json)
        required: true
        default: 0.1.4
permissions:
  contents: write
jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check requested version
        shell: pwsh
        run: |
          $actual = (Get-Content "channels/${{ inputs.channel }}/channel.json" | ConvertFrom-Json).version
          if ($actual -ne "${{ inputs.version }}") { throw "requested version does not match channel.json" }
      - run: node src/hubctl.js package ${{ inputs.channel }} --target windows-x64 --bundle-runtime
      - run: node src/hubctl.js verify artifacts/${{ inputs.channel }}-${{ inputs.version }}-windows-x64.echochannel
      - run: node src/hubctl.js build-registry
      - run: node src/hubctl.js validate
      - name: Publish TEST ONLY preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ inputs.version }}
          name: TEST ONLY preview ${{ inputs.channel }} ${{ inputs.version }}
          prerelease: true
          make_latest: false
          body: "TEST ONLY preview. Signed by the committed non-production test key. Never trust in production."
          files: |
            artifacts/${{ inputs.channel }}-${{ inputs.version }}-windows-x64.echochannel
            artifacts/${{ inputs.channel }}-${{ inputs.version }}-windows-x64.echochannel.json
